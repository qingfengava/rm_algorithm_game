services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arena}
      POSTGRES_USER: ${POSTGRES_USER:-arena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arena_local_only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: ${OBJECT_STORAGE_IMAGE:-localstack/localstack:3.8.1}
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY:-test}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_KEY:-test}
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-arena}
      POSTGRES_USER: ${POSTGRES_USER:-arena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arena_local_only}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OBJECT_STORAGE_ENDPOINT: http://minio:4566
      OBJECT_STORAGE_PUBLIC_ENDPOINT: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:-http://localhost:4566}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-arena-submissions}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-test}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-test}
      OBJECT_STORAGE_CORS_ORIGIN: ${OBJECT_STORAGE_CORS_ORIGIN:-http://localhost:8081}
      OBJECT_STORAGE_AUTO_CREATE: "true"
      ARENA_DEV_HANDLE: ${ARENA_DEV_HANDLE:-local_player}
      ARENA_DEV_TOKEN: ${ARENA_DEV_TOKEN:-arena_local_dev_token_replace_me}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  scheduler:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-arena}
      POSTGRES_USER: ${POSTGRES_USER:-arena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arena_local_only}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SCHEDULER_INTERVAL_MS: ${SCHEDULER_INTERVAL_MS:-5000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  compile-worker:
    build:
      context: .
      dockerfile: services/compile-worker/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-arena}
      POSTGRES_USER: ${POSTGRES_USER:-arena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arena_local_only}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OBJECT_STORAGE_ENDPOINT: http://minio:4566
      OBJECT_STORAGE_PUBLIC_ENDPOINT: http://minio:4566
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-arena-submissions}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-test}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-test}
      OBJECT_STORAGE_AUTO_CREATE: "true"
      COMPILE_TIMEOUT_MS: ${COMPILE_TIMEOUT_MS:-45000}
      COMPILE_INTERVAL_MS: ${COMPILE_INTERVAL_MS:-5000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped

  match-worker:
    build:
      context: .
      dockerfile: services/match-worker/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-arena}
      POSTGRES_USER: ${POSTGRES_USER:-arena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arena_local_only}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OBJECT_STORAGE_ENDPOINT: http://minio:4566
      OBJECT_STORAGE_PUBLIC_ENDPOINT: http://minio:4566
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-arena-submissions}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-test}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-test}
      OBJECT_STORAGE_AUTO_CREATE: "true"
      MATCH_TIMEOUT_MS: ${MATCH_TIMEOUT_MS:-15000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 768m
    cpus: 2
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  test:
    image: node:22-bookworm-slim
    working_dir: /workspace
    environment:
      API_URL: http://api:8080
      WEB_URL: http://web
    volumes:
      - ./tests:/workspace/tests:ro
    command: ["node", "/workspace/tests/smoke.js"]
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
