name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpp:
    name: C++23 build and tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DARENA_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  source:
    name: Source checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install --yes clang-format

      - name: Run source checks
        run: ./scripts/check.sh

  containers:
    name: Container builds
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose config --quiet

      - name: Build API image
        run: docker build -f services/api/Dockerfile -t arena/api:ci services/api

      - name: Build web image
        run: docker build -f web/Dockerfile -t arena/web:ci web

      - name: Build C++ compile image
        run: docker build -f infra/docker/cpp-compile.Dockerfile -t arena/cpp-compile:ci .

      - name: Build runtime image
        run: docker build -f infra/docker/runtime.Dockerfile -t arena/runtime:ci .

  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start local stack and run smoke test
        run: docker compose up --build --abort-on-container-exit --exit-code-from test

      - name: Collect service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop local stack
        if: always()
        run: docker compose down --volumes
