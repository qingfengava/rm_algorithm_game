<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>无人机算法对抗赛</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7fb;
        color: #172033;
      }

      body {
        margin: 0;
      }

      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 64px 24px;
      }

      .panel {
        background: #fff;
        border: 1px solid #dfe5ef;
        border-radius: 8px;
        padding: 24px;
        box-shadow: 0 8px 24px rgb(23 32 51 / 7%);
      }

      h1 {
        margin-top: 0;
      }

      #status {
        color: #52617a;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <h1>无人机算法对抗赛</h1>
        <p>阶段 1 开发环境已启动。</p>
        <p id="status">正在检查 API、数据库、队列和对象存储...</p>
      </section>
    </main>
    <script>
      fetch('/api/v1/health')
        .then((response) => response.json().then((body) => ({ response, body })))
        .then(({ response, body }) => {
          const status = document.querySelector('#status');
          status.textContent = `${response.ok ? '服务正常' : '服务异常'}：${JSON.stringify(body)}`;
        })
        .catch((error) => {
          document.querySelector('#status').textContent = `API 连接失败：${error.message}`;
        });
    </script>
  </body>
</html>
