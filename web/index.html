<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14283f">
  <title>空域竞技场</title>
  <style>
    :root{color-scheme:light;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--ink:#182230;--muted:#697586;--line:#dce2e9;--surface:#fff;--wash:#f4f6f8;--navy:#14283f;--blue:#1769aa;--green:#18794e;--amber:#9a5b00;--red:#b42318}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--wash)}button,input{font:inherit}button{cursor:pointer}
    .login-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:#e9edf2}.login-box{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);padding:32px;border-radius:8px;box-shadow:0 18px 45px #14283f1f}.brand-mark{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:6px;color:white;background:var(--navy);font-weight:800}.login-box h1{margin:20px 0 8px;font-size:28px}.login-box p{margin:0 0 24px;color:var(--muted)}
    .field{display:grid;gap:8px;margin-bottom:18px}.field label{color:#364152;font-size:13px;font-weight:650}input[type=text],input[type=password],input[type=file],input[type=number],select{width:100%;border:1px solid #c8d0da;border-radius:5px;padding:10px 12px;background:#fff;color:var(--ink)}input:focus,select:focus{outline:2px solid #1769aa33;border-color:var(--blue)}
    .primary,.secondary{border-radius:5px;padding:10px 16px;font-weight:700}.primary{border:1px solid var(--blue);background:var(--blue);color:#fff}.primary:hover{background:#125887}.secondary{border:1px solid #bdc8d4;background:#fff;color:#344054}.secondary:hover{border-color:var(--blue);color:var(--blue)}.danger{color:var(--red)}.error{color:var(--red);font-size:13px;margin:12px 0}
    .app{min-height:100vh;display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:64px minmax(0,1fr)}.topbar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:var(--navy);color:#fff}.identity{display:flex;gap:10px;align-items:center;font-weight:750}.account{display:flex;gap:14px;align-items:center;font-size:13px;color:#d7e0eb}.account button{border:0;background:transparent;color:#d7e0eb;padding:5px}
    .sidebar{grid-row:2;border-right:1px solid var(--line);background:#fbfcfd;padding:20px 12px}.nav-label{padding:0 12px 8px;color:#8994a3;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.nav{display:grid;gap:4px}.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:5px;padding:10px 12px;text-align:left;color:#4a5565;background:transparent;font-weight:620}.nav button:hover,.nav button.active{color:var(--navy);background:#e9eff5}.nav .icon{display:inline-grid;place-items:center;width:20px;color:#64748b;font-size:16px}.content{grid-column:2;grid-row:2;min-width:0;padding:28px clamp(18px,4vw,52px);overflow:auto}
    .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}.page-head h1{margin:0 0 6px;font-size:26px}.page-head p{margin:0;color:var(--muted);font-size:14px}.page-actions{display:flex;gap:8px;flex-wrap:wrap}.section{background:var(--surface);border:1px solid var(--line);border-radius:7px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}.section-head h2{margin:0;font-size:15px}.section-body{padding:18px}.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}.stat{padding:17px 18px;background:var(--surface);border:1px solid var(--line);border-radius:7px}.stat small{display:block;color:var(--muted);font-size:12px;margin-bottom:10px}.stat strong{display:block;font-size:25px;font-variant-numeric:tabular-nums}.grid-2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.8fr);gap:18px}
    .table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:12px 16px;border-bottom:1px solid #edf0f3;text-align:left;white-space:nowrap}th{color:#687386;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:#fafbfc}tr:last-child td{border-bottom:0}tbody tr[data-link]{cursor:pointer}tbody tr[data-link]:hover{background:#f5f8fb}.empty{padding:34px 18px;text-align:center;color:var(--muted)}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:750;background:#eef1f4;color:#596575}.badge.good{background:#e4f4ec;color:var(--green)}.badge.wait{background:#fff1d8;color:var(--amber)}.badge.bad{background:#fde8e7;color:var(--red)}.badge.blue{background:#e4effa;color:var(--blue)}.muted{color:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
    .form-layout{max-width:680px}.drop-zone{display:grid;place-items:center;min-height:142px;border:1px dashed #aebaca;border-radius:6px;padding:22px;background:#fafbfc;text-align:center}.drop-zone input{max-width:420px}.progress{height:6px;border-radius:5px;overflow:hidden;background:#e6eaf0}.progress span{display:block;width:0;height:100%;background:var(--blue);transition:width .2s}.status-line{display:flex;align-items:center;gap:10px;padding:11px 0;color:#4c5868;font-size:13px}.status-dot{width:8px;height:8px;border-radius:50%;background:#a6b0bc}.status-dot.done{background:var(--green)}.status-dot.current{background:var(--blue);box-shadow:0 0 0 4px #1769aa26}.log{max-height:280px;overflow:auto;padding:14px;border:1px solid var(--line);border-radius:5px;background:#111827;color:#d1d9e6;white-space:pre-wrap;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;overflow:hidden;background:var(--line);border:1px solid var(--line);border-radius:6px}.detail-cell{padding:13px 15px;background:#fff}.detail-cell small{display:block;margin-bottom:5px;color:var(--muted);font-size:11px}.detail-cell strong{font-size:13px;font-weight:650}
    .replay-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}.replay-toolbar input[type=range]{flex:1;min-width:180px;accent-color:var(--blue)}.board-shell{display:grid;grid-template-columns:minmax(260px,390px) 1fr;gap:24px;align-items:start}.board{display:grid;grid-template-columns:repeat(4,1fr);aspect-ratio:1;border:1px solid #aab6c4;background:#d9e1e8}.cell{position:relative;min-width:0;border-right:1px solid #b9c5d0;border-bottom:1px solid #b9c5d0;background:#f7f9fb}.cell:nth-child(4n){border-right:0}.cell:nth-last-child(-n+4){border-bottom:0}.cell.obstacle{background:#697586}.cell .coord{position:absolute;top:3px;left:4px;color:#9ba8b6;font-size:9px}.drone{position:absolute;inset:25%;display:grid;place-items:center;border-radius:50%;color:white;font-size:12px;font-weight:800}.drone.red{background:#c2413b}.drone.blue{background:#1d73ae}.replay-events{max-height:390px;overflow:auto;border:1px solid var(--line);border-radius:6px}.event-row{display:grid;grid-template-columns:42px 92px 1fr;gap:8px;padding:9px 11px;border-bottom:1px solid #edf0f3;font-size:12px}.event-row.active{background:#eaf2f9}.event-row:last-child{border-bottom:0}.event-row .seq{color:var(--muted);font-variant-numeric:tabular-nums}.toast{position:fixed;right:20px;bottom:20px;z-index:5;max-width:360px;padding:12px 15px;border:1px solid #b9c8d8;border-radius:6px;background:#fff;box-shadow:0 10px 24px #14283f26;font-size:13px}
    @media(max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:60px auto 1fr}.topbar{grid-column:1}.sidebar{grid-column:1;grid-row:2;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}.nav-label{display:none}.nav{display:flex;min-width:max-content}.nav button{width:auto}.content{grid-column:1;grid-row:3;padding:22px 16px}.stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-2,.board-shell{grid-template-columns:1fr}}@media(max-width:520px){.topbar{padding:0 15px}.account span{display:none}.page-head{display:block}.page-actions{margin-top:14px}.stat-grid{gap:8px}.stat{padding:13px}.stat strong{font-size:21px}.detail-grid{grid-template-columns:1fr}}
  </style>
</head>
<body><div id="root"></div>
<script>
(() => {
  const root = document.querySelector('#root');
  let storedUser = null; try { storedUser = JSON.parse(localStorage.getItem('arena_user') || 'null'); } catch { storedUser = null; }
  const state = { token: localStorage.getItem('arena_token') || '', user: storedUser, route: location.hash.slice(1) || 'dashboard', data: {}, timer: null, replayIndex: 0, playing: false };
  const esc = (value) => String(value == null ? '' : value).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const date = (value) => value ? new Date(value).toLocaleString('zh-CN', { hour12:false }) : '—';
  const short = (value, count) => value ? String(value).slice(0, count || 8) + '…' : '—';
  const statusText = { UPLOADED:'待上传确认', COMPILING:'编译中', COMPILE_FAILED:'编译失败', QUEUED:'排队中', RUNNING:'比赛中', FINISHED:'已完成', RUNTIME_FAILED:'运行失败' };
  const badge = (value) => { const cls = value === 'FINISHED' ? 'good' : ['COMPILE_FAILED','RUNTIME_FAILED'].includes(value) ? 'bad' : ['UPLOADED','COMPILING','QUEUED','RUNNING'].includes(value) ? 'wait' : ''; return '<span class="badge ' + cls + '">' + esc(statusText[value] || value || '未知') + '</span>'; };
  const navItems = [['dashboard','⌂','控制台'],['submit','+','提交算法'],['leaderboard','№','排行榜'],['matches','▦','比赛'],['versions','◫','我的版本']];
  const adminNavItems = [['admin-users','♙','管理账户'],['admin-submissions','◈','管理算法'],['admin-leaderboard','◆','排行榜管理']];
  async function api(path, options) {
    options = options || {}; const headers = new Headers(options.headers || {});
    if (state.token) headers.set('Authorization', 'Bearer ' + state.token);
    if (options.body && !(options.body instanceof FormData) && !headers.has('content-type')) headers.set('content-type','application/json');
    const response = await fetch('/api' + path, Object.assign({}, options, { headers }));
    const text = await response.text(); let body = {}; try { body = text ? JSON.parse(text) : {}; } catch { body = { error:text }; }
    if (!response.ok) throw new Error(body.error || '请求失败（' + response.status + '）'); return body;
  }
  function go(route) { location.hash = route; }
  function shell(content) {
    const current = state.route.split('/')[0];
    const items = navItems.concat(state.user && state.user.role === 'ADMIN' ? adminNavItems : []);
    return '<div class="app"><header class="topbar"><div class="identity"><span class="brand-mark">A</span><span>空域竞技场</span></div><div class="account"><span>' + esc(state.user ? state.user.handle : '') + '</span><button data-action="logout">退出</button></div></header><aside class="sidebar"><div class="nav-label">Workspace</div><nav class="nav">' + items.map((item) => '<button class="' + (current === item[0] ? 'active' : '') + '" data-route="' + item[0] + '"><span class="icon">' + item[1] + '</span>' + item[2] + '</button>').join('') + '</nav></aside><main class="content">' + content + '</main></div>';
  }
  const head = (title, subtitle, actions) => '<div class="page-head"><div><h1>' + esc(title) + '</h1><p>' + esc(subtitle) + '</p></div><div class="page-actions">' + (actions || '') + '</div></div>';
  const loading = (title) => '<div class="section"><div class="empty">' + esc(title || '正在加载') + '…</div></div>';
  function login() {
    root.innerHTML = '<div class="login-page"><section class="login-box"><span class="brand-mark">A</span><h1>进入空域竞技场</h1><p>使用账号和密码登录竞技场。</p><form id="login-form"><div class="field"><label for="handle">账号</label><input id="handle" type="text" autocomplete="username" required placeholder="请输入账号"></div><div class="field"><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required placeholder="请输入密码"></div><div id="login-error" class="error" hidden></div><button class="primary" type="submit">登录</button></form></section></div>';
    document.querySelector('#login-form').addEventListener('submit', async (event) => { event.preventDefault(); const handle = document.querySelector('#handle').value.trim(), password = document.querySelector('#password').value; try { const result = await api('/login',{method:'POST',body:JSON.stringify({handle,password})}); state.token=result.token; state.user=result.user; localStorage.setItem('arena_token',result.token); localStorage.setItem('arena_user',JSON.stringify(result.user)); go('dashboard'); } catch (error) { const node = document.querySelector('#login-error'); node.textContent = error.message; node.hidden = false; } });
  }
  function tableMatches(rows) {
    if (!rows || !rows.length) return '<div class="empty">暂无比赛</div>';
    return '<div class="table-wrap"><table><thead><tr><th>红方</th><th>蓝方</th><th>状态</th><th>结果</th><th>时间</th></tr></thead><tbody>' + rows.map((m) => '<tr data-link="matches/' + m.id + '"><td>' + esc(m.red_name) + '</td><td>' + esc(m.blue_name) + '</td><td>' + badge(m.status) + '</td><td>' + esc(m.winner || '—') + '</td><td class="muted">' + date(m.created_at) + '</td></tr>').join('') + '</tbody></table></div>';
  }
  function tableBoard(rows) {
    if (!rows || !rows.length) return '<div class="empty">暂无排行榜数据</div>';
    return '<div class="table-wrap"><table><thead><tr><th>排名</th><th>算法</th><th>得分率</th><th>胜率</th><th>战绩</th></tr></thead><tbody>' + rows.map((e) => '<tr><td><strong>#' + e.rank + '</strong></td><td><strong>' + esc(e.submission_name) + '</strong><br><span class="muted">' + esc(e.user_handle || short(e.submission_id)) + '</span></td><td>' + (Number(e.points_rate) * 100).toFixed(1) + '%</td><td>' + (Number(e.win_rate) * 100).toFixed(1) + '%</td><td>' + e.wins + ' / ' + e.draws + ' / ' + e.losses + '</td></tr>').join('') + '</tbody></table></div>';
  }
  async function dashboard() {
    root.innerHTML = shell(loading('正在读取竞技场状态'));
    try {
      const result = await Promise.all([api('/health'), api('/leaderboard?limit=5'), api('/matches?limit=5'), api('/submissions?limit=5')]);
      const health = result[0], board = result[1], matches = result[2], versions = result[3];
      root.innerHTML = shell(head('控制台','算法提交、比赛和排行榜总览','<button class="primary" data-route="submit">+ 提交算法</button>') + '<div class="stat-grid"><div class="stat"><small>服务状态</small><strong style="color:var(--green)">' + (health.status === 'ok' ? '正常' : '异常') + '</strong></div><div class="stat"><small>我的版本</small><strong>' + versions.submissions.length + '</strong></div><div class="stat"><small>近期比赛</small><strong>' + matches.matches.length + '</strong></div><div class="stat"><small>已完成</small><strong>' + matches.matches.filter((m) => m.status === 'FINISHED').length + '</strong></div></div><div class="grid-2"><section class="section"><div class="section-head"><h2>最新比赛</h2><button class="secondary" data-route="matches">查看全部</button></div>' + tableMatches(matches.matches) + '</section><section class="section"><div class="section-head"><h2>排行榜前列</h2><button class="secondary" data-route="leaderboard">完整榜单</button></div>' + tableBoard(board.entries) + '</section></div>');
    } catch (error) { root.innerHTML = shell('<div class="section"><div class="empty">' + esc(error.message) + '<br><button class="secondary" data-action="refresh">重试</button></div></div>'); }
  }
  async function submitPage() {
    root.innerHTML = shell(head('提交算法','C++23 源码包') + '<section class="section form-layout"><div class="section-body"><form id="submit-form"><div class="field"><label for="algorithm-name">版本名称</label><input id="algorithm-name" type="text" maxlength="80" required placeholder="例如：追踪策略 01"></div><div class="field"><label for="source-file">源码包</label><div class="drop-zone"><input id="source-file" type="file" accept=".zip,application/zip" required><span class="muted">ZIP 内必须包含 bot.cpp</span></div></div><div id="upload-error" class="error" hidden></div><div id="upload-progress" hidden><div class="status-line"><span class="status-dot current"></span><span id="upload-label">正在上传</span></div><div class="progress"><span id="upload-bar"></span></div></div><div style="margin-top:20px"><button class="primary" type="submit">上传并开始编译</button></div></form></div></section>');
    document.querySelector('#submit-form').addEventListener('submit', uploadSubmission);
  }
  async function uploadSubmission(event) {
    event.preventDefault(); const file = document.querySelector('#source-file').files[0]; if (!file) return;
    const errorNode = document.querySelector('#upload-error'), progress = document.querySelector('#upload-progress'), label = document.querySelector('#upload-label'), bar = document.querySelector('#upload-bar'); progress.hidden = false; errorNode.hidden = true;
    try { label.textContent = '创建提交记录'; bar.style.width = '8%'; const created = await api('/submissions',{method:'POST',body:JSON.stringify({name:document.querySelector('#algorithm-name').value.trim()})}); label.textContent = '上传源码'; bar.style.width = '25%'; const form = new FormData(); Object.entries(created.upload.fields).forEach(([key,value]) => form.append(key,value)); form.append('file',file,file.name); const upload = await fetch(created.upload.url,{method:'POST',body:form}); if (!upload.ok) throw new Error('对象存储上传失败（' + upload.status + '）'); label.textContent = '提交编译队列'; bar.style.width = '78%'; await api('/submissions/' + created.submission.id + '/complete',{method:'POST'}); bar.style.width = '100%'; go('versions/' + created.submission.id); } catch (error) { errorNode.textContent = error.message; errorNode.hidden = false; progress.hidden = true; }
  }
  function versionRows(rows) {
    if (!rows || !rows.length) return '<div class="empty">还没有提交版本</div>';
    return '<div class="table-wrap"><table><thead><tr><th>版本</th><th>状态</th><th>当前版本</th><th>提交时间</th><th>失败原因</th></tr></thead><tbody>' + rows.map((r) => '<tr data-link="versions/' + r.id + '"><td><strong>' + esc(r.name) + '</strong><br><span class="mono muted">' + short(r.id,12) + '</span></td><td>' + badge(r.status) + '</td><td>' + (r.is_current ? '<span class="badge blue">当前</span>' : '<span class="muted">历史</span>') + '</td><td class="muted">' + date(r.created_at) + '</td><td class="danger">' + esc(r.failure_reason || '—') + '</td></tr>').join('') + '</tbody></table></div>';
  }
  async function versionsPage() { root.innerHTML = shell(loading('正在读取版本')); try { const body = await api('/submissions?limit=100'); root.innerHTML = shell(head('我的版本','提交记录与编译状态','<button class="primary" data-route="submit">+ 提交算法</button>') + '<section class="section">' + versionRows(body.submissions) + '</section>'); } catch (error) { root.innerHTML = shell('<div class="section"><div class="empty">' + esc(error.message) + '</div></div>'); } }
  function timeline(status) { const steps = [['UPLOADED','已接收'],['COMPILING','编译和资格赛'],['QUEUED','等待匹配'],['RUNNING','正式比赛'],['FINISHED','完成']]; const order = steps.findIndex((s) => s[0] === status); return '<div style="margin-bottom:18px">' + steps.map((s,i) => '<div class="status-line"><span class="status-dot ' + (i < order || status === 'FINISHED' ? 'done' : i === order ? 'current' : '') + '"></span><span>' + s[1] + '</span>' + (s[0] === status ? '<span class="muted">' + statusText[status] + '</span>' : '') + '</div>').join('') + (['COMPILE_FAILED','RUNTIME_FAILED'].includes(status) ? '<div class="status-line danger"><span class="status-dot" style="background:var(--red)"></span><span>' + statusText[status] + '</span></div>' : '') + '</div>'; }
  async function versionDetail(id) { root.innerHTML = shell(loading('正在读取版本详情')); try { const body = await api('/submissions/' + id), r = body.submission; root.innerHTML = shell(head(r.name,'版本 ' + short(r.id,12),'<button class="secondary" data-route="versions">返回版本列表</button>') + '<div class="grid-2"><section class="section"><div class="section-head"><h2>状态</h2>' + badge(r.status) + '</div><div class="section-body">' + timeline(r.status) + '<div class="detail-grid"><div class="detail-cell"><small>提交时间</small><strong>' + date(r.created_at) + '</strong></div><div class="detail-cell"><small>更新时间</small><strong>' + date(r.updated_at) + '</strong></div><div class="detail-cell"><small>源码大小</small><strong>' + (r.source.size_bytes ? (r.source.size_bytes / 1024).toFixed(1) + ' KB' : '—') + '</strong></div><div class="detail-cell"><small>当前版本</small><strong>' + (r.is_current ? '是' : '否') + '</strong></div></div></div></section><section class="section"><div class="section-head"><h2>编译日志</h2></div><div class="section-body"><pre class="log">' + esc(r.compile_log || r.failure_reason || '暂无编译日志') + '</pre></div></section></div>'); if (['UPLOADED','COMPILING','QUEUED','RUNNING'].includes(r.status)) schedule(() => versionDetail(id),4000); } catch (error) { root.innerHTML = shell('<div class="section"><div class="empty">' + esc(error.message) + '</div></div>'); } }
  async function leaderboardPage() { root.innerHTML = shell(loading('正在读取排行榜')); try { const body = await api('/leaderboard?limit=100'); root.innerHTML = shell(head('排行榜','当前有效算法的正式对战成绩','<button class="secondary" data-action="refresh">刷新</button>') + '<section class="section">' + tableBoard(body.entries) + '</section>'); } catch (error) { root.innerHTML = shell('<div class="section"><div class="empty">' + esc(error.message) + '</div></div>'); } }
  async function adminUsersPage() {
    root.innerHTML = shell(loading('正在读取账户'));
    try {
      const body = await api('/admin/users?limit=100');
      const rows = body.users.map((u) => '<tr><td><strong>' + esc(u.handle) + '</strong><br><span class="mono muted">' + short(u.id,12) + '</span></td><td><select data-user-role="' + u.id + '"><option value="PLAYER" ' + (u.role === 'PLAYER' ? 'selected' : '') + '>选手</option><option value="ADMIN" ' + (u.role === 'ADMIN' ? 'selected' : '') + '>管理员</option></select></td><td><label><input type="checkbox" data-user-active="' + u.id + '" ' + (u.active ? 'checked' : '') + '> 启用</label></td><td class="muted">' + date(u.created_at) + '</td><td><button class="secondary" data-admin-action="save-user" data-id="' + u.id + '">保存</button> <button class="secondary" data-admin-action="password-user" data-id="' + u.id + '">改密码</button></td></tr>').join('');
      const table = rows ? '<div class="table-wrap"><table><thead><tr><th>账号</th><th>角色</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '<div class="empty">暂无账户</div>';
      root.innerHTML = shell(head('管理账户','创建账户并控制访问权限') + '<section class="section form-layout"><div class="section-head"><h2>新建账户</h2></div><div class="section-body"><form id="admin-user-form"><div class="field"><label>账号</label><input id="new-user-handle" type="text" minlength="3" maxlength="32" required></div><div class="field"><label>初始密码</label><input id="new-user-password" type="password" minlength="1" required></div><div class="field"><label>角色</label><select id="new-user-role"><option value="PLAYER">选手</option><option value="ADMIN">管理员</option></select></div><button class="primary" type="submit">创建账户</button><div id="admin-user-error" class="error" hidden></div></form></div></section><section class="section" style="margin-top:18px"><div class="section-head"><h2>现有账户</h2></div>' + table + '</section>');
      document.querySelector('#admin-user-form').addEventListener('submit', async (event) => { event.preventDefault(); const error = document.querySelector('#admin-user-error'); error.hidden = true; try { await api('/admin/users', { method:'POST', body: JSON.stringify({ handle:document.querySelector('#new-user-handle').value.trim(), password:document.querySelector('#new-user-password').value, role:document.querySelector('#new-user-role').value }) }); adminUsersPage(); } catch (e) { error.textContent = e.message; error.hidden = false; } });
    } catch (error) { root.innerHTML = shell('<div class="section"><div class="empty">' + esc(error.message) + '</div></div>'); }
  }
  async function adminSubmissionsPage() {
    root.innerHTML = shell(loading('正在读取算法'));
    try { const body = await api('/admin/submissions?limit=100'); const rows = body.submissions.map((s) => '<tr><td><strong>' + esc(s.name) + '</strong><br><span class="muted">' + esc(s.user_handle) + '</span></td><td>' + badge(s.status) + '</td><td>' + (s.is_current ? '<span class="badge blue">当前</span>' : '<span class="muted">历史</span>') + '</td><td>' + (s.deleted_at ? '<span class="badge bad">已删除</span>' : '<span class="badge good">有效</span>') + '</td><td class="muted">' + date(s.created_at) + '</td><td>' + (!s.deleted_at ? '<button class="secondary" data-admin-action="delete-submission" data-id="' + s.id + '">删除算法</button>' : '—') + '</td></tr>').join(''); root.innerHTML = shell(head('管理算法','删除后保留比赛和回放历史','<button class="secondary" data-action="refresh">刷新</button>') + '<section class="section"><div class="table-wrap"><table><thead><tr><th>算法</th><th>状态</th><th>当前版本</th><th>记录</th><th>提交时间</th><th>操作</th></tr></thead><tbody>' + (rows || '<tr><td colspan="6" class="empty">暂无算法</td></tr>') + '</tbody></table></div></section>'); } catch (error) { root.innerHTML = shell('<div class="section"><div class="empty">' + esc(error.message) + '</div></div>'); }
  }
  async function adminLeaderboardPage() {
    root.innerHTML = shell(loading('正在读取排行榜'));
    try { const body = await api('/leaderboard?limit=100'); const rows = body.entries.map((e) => '<tr><td><strong>#' + e.rank + '</strong></td><td>' + esc(e.submission_name) + '<br><span class="muted">' + esc(e.user_handle || '') + '</span></td><td><input type="number" min="0" value="' + e.wins + '" data-board="wins-' + e.submission_id + '"></td><td><input type="number" min="0" value="' + e.draws + '" data-board="draws-' + e.submission_id + '"></td><td><input type="number" min="0" value="' + e.losses + '" data-board="losses-' + e.submission_id + '"></td><td><button class="secondary" data-admin-action="save-board" data-id="' + e.submission_id + '">覆盖</button> <button class="secondary" data-admin-action="clear-board" data-id="' + e.submission_id + '">清除</button></td></tr>').join(''); root.innerHTML = shell(head('排行榜管理','调整成绩覆盖或从比赛记录重算','<button class="secondary" data-admin-action="recalculate">重新计算</button><button class="secondary" data-admin-action="recalculate-clear">清除覆盖并重算</button>') + '<section class="section"><div class="table-wrap"><table><thead><tr><th>排名</th><th>算法</th><th>胜场</th><th>平局</th><th>负场</th><th>操作</th></tr></thead><tbody>' + (rows || '<tr><td colspan="6" class="empty">暂无排行榜数据</td></tr>') + '</tbody></table></div></section>'); } catch (error) { root.innerHTML = shell('<div class="section"><div class="empty">' + esc(error.message) + '</div></div>'); }
  }
  async function matchesPage() { root.innerHTML = shell(loading('正在读取比赛')); try { const body = await api('/matches?limit=100'); root.innerHTML = shell(head('比赛','正式 BO1 对局记录','<button class="secondary" data-action="refresh">刷新</button>') + '<section class="section">' + tableMatches(body.matches) + '</section>'); } catch (error) { root.innerHTML = shell('<div class="section"><div class="empty">' + esc(error.message) + '</div></div>'); } }
  async function matchDetail(id) { root.innerHTML = shell(loading('正在读取比赛详情')); try { const body = await api('/matches/' + id), m = body.match, done = m.status === 'FINISHED'; root.innerHTML = shell(head('比赛详情',m.red_name + '  对  ' + m.blue_name,'<button class="secondary" data-route="matches">返回比赛列表</button>') + '<section class="section"><div class="section-body"><div class="detail-grid"><div class="detail-cell"><small>红方</small><strong>' + esc(m.red_name) + '</strong></div><div class="detail-cell"><small>蓝方</small><strong>' + esc(m.blue_name) + '</strong></div><div class="detail-cell"><small>状态</small><strong>' + badge(m.status) + '</strong></div><div class="detail-cell"><small>胜者</small><strong>' + esc(m.winner || '—') + '</strong></div><div class="detail-cell"><small>地图种子</small><strong class="mono">' + esc(m.map_seed) + '</strong></div><div class="detail-cell"><small>事件数</small><strong>' + m.event_count + '</strong></div></div><div style="margin-top:18px">' + (done ? '<button class="primary" data-route="replay/' + id + '">打开比赛回放</button>' : '<span class="muted">比赛完成后可查看回放</span>') + '</div>' + (m.failure_reason ? '<p class="error">' + esc(m.failure_reason) + '</p>' : '') + '</div></section>'); if (!done && ['QUEUED','RUNNING'].includes(m.status)) schedule(() => matchDetail(id),4000); } catch (error) { root.innerHTML = shell('<div class="section"><div class="empty">' + esc(error.message) + '</div></div>'); } }
  async function replayPage(id) { stop(); root.innerHTML = shell(loading('正在读取回放')); try { state.data.replay = await api('/matches/' + id + '/replay'); state.replayIndex = 0; renderReplay(id); } catch (error) { if (error.message.includes('replay_not_ready')) { root.innerHTML = shell(head('比赛回放','比赛尚未完成','<button class="secondary" data-route="matches">返回比赛</button>') + '<div class="section"><div class="empty">回放将在比赛完成后生成。</div></div>'); schedule(() => replayPage(id),4000); } else root.innerHTML = shell('<div class="section"><div class="empty">' + esc(error.message) + '</div></div>'); } }
  function renderReplay(id) { const replay = state.data.replay, events = replay.events || [], index = Math.min(state.replayIndex, Math.max(events.length - 1,0)), item = events[index] || { state_after:replay.initial_state }, current = item.state_after || {}, plane = Number(current.red && current.red.z || 0), obstacles = (replay.map && replay.map.obstacles || []).filter((c) => Number(c.z) === plane), drones = [current.red,current.blue].filter(Boolean); const cells = Array.from({length:16},(_,n) => { const x=n%4,y=Math.floor(n/4), obstacle=obstacles.some((c)=>Number(c.x)===x&&Number(c.y)===y), here=drones.filter((d)=>Number(d.x)===x&&Number(d.y)===y&&d.alive); return '<div class="cell ' + (obstacle?'obstacle':'') + '"><span class="coord">' + x + ',' + y + '</span>' + here.map((d)=>'<span class="drone ' + (d === current.red ? 'red':'blue') + '">' + (d === current.red ? 'R':'B') + '</span>').join('') + '</div>'; }).join(''); root.innerHTML = shell(head('比赛回放','地图 ' + replay.map_seed + ' · ' + (replay.winner || '—'),'<button class="secondary" data-route="matches">返回比赛</button>') + '<section class="section"><div class="section-body"><div class="replay-toolbar"><button class="secondary" data-action="replay-toggle">' + (state.playing?'暂停':'播放') + '</button><input id="replay-range" type="range" min="0" max="' + Math.max(events.length-1,0) + '" value="' + index + '"><span class="mono">' + (events.length ? (index+1) + ' / ' + events.length : '0 / 0') + '</span></div><div class="board-shell"><div><div class="muted" style="margin-bottom:8px">' + (plane === 1 ? '上平面':'下平面') + ' · ' + esc(item.type || 'MATCH_STARTED') + '</div><div class="board">' + cells + '</div></div><div class="replay-events">' + events.map((e,i)=>'<div class="event-row ' + (i===index?'active':'') + '" data-replay-index="' + i + '"><span class="seq">#' + i + '</span><strong>' + esc(e.side || '—') + '</strong><span>' + esc((e.action && e.action.type) || e.type || '事件') + ' · ' + esc(e.effect || '') + '</span></div>').join('') + '</div></div></div></section>'); document.querySelector('#replay-range').addEventListener('input',(event)=>{state.replayIndex=Number(event.target.value);renderReplay(id);}); }
  function schedule(callback, delay) { stop(); state.timer = setTimeout(callback,delay); } function stop() { if (state.timer) { clearTimeout(state.timer); state.timer=null; } }
  function route() { stop(); state.route=location.hash.slice(1)||'dashboard'; if (!state.token) return login(); const parts=state.route.split('/'), type=parts[0], id=parts[1]; if(type==='dashboard')dashboard(); else if(type==='submit')submitPage(); else if(type==='leaderboard')leaderboardPage(); else if(type==='matches'&&id)matchDetail(id); else if(type==='matches')matchesPage(); else if(type==='replay'&&id)replayPage(id); else if(type==='versions'&&id)versionDetail(id); else if(type==='versions')versionsPage(); else if(type==='admin-users' && state.user.role === 'ADMIN')adminUsersPage(); else if(type==='admin-submissions' && state.user.role === 'ADMIN')adminSubmissionsPage(); else if(type==='admin-leaderboard' && state.user.role === 'ADMIN')adminLeaderboardPage(); else dashboard(); }
  document.addEventListener('click', async (event)=>{ const routeNode=event.target.closest('[data-route]');if(routeNode){go(routeNode.dataset.route);return;} const actionNode=event.target.closest('[data-admin-action]'); const adminAction=actionNode&&actionNode.dataset.adminAction; if(adminAction){const id=actionNode.dataset.id;try{if(adminAction==='save-user'){await api('/admin/users/'+id,{method:'PATCH',body:JSON.stringify({role:document.querySelector('[data-user-role="'+id+'"]')?.value,active:document.querySelector('[data-user-active="'+id+'"]')?.checked})});adminUsersPage();}else if(adminAction==='password-user'){const password=prompt('请输入新密码');if(password) {await api('/admin/users/'+id,{method:'PATCH',body:JSON.stringify({password})});adminUsersPage();}}else if(adminAction==='delete-submission'){if(confirm('确认删除此算法？比赛和回放历史会保留。')){await api('/admin/submissions/'+id,{method:'DELETE'});adminSubmissionsPage();}}else if(adminAction==='save-board'){const read=(name)=>Number(document.querySelector('[data-board="'+name+'-'+id+'"]')?.value);await api('/admin/leaderboard/'+id,{method:'PUT',body:JSON.stringify({wins:read('wins'),draws:read('draws'),losses:read('losses')})});adminLeaderboardPage();}else if(adminAction==='clear-board'){await api('/admin/leaderboard/'+id,{method:'DELETE'});adminLeaderboardPage();}else if(adminAction==='recalculate'){await api('/admin/leaderboard/recalculate',{method:'POST',body:JSON.stringify({})});adminLeaderboardPage();}else if(adminAction==='recalculate-clear'){await api('/admin/leaderboard/recalculate?clear_overrides=true',{method:'POST',body:JSON.stringify({})});adminLeaderboardPage();}}catch(error){alert(error.message);}return;} const action=event.target.closest('[data-action]')&&event.target.closest('[data-action]').dataset.action;if(action==='logout'){state.token='';state.user=null;localStorage.removeItem('arena_token');localStorage.removeItem('arena_user');go('login');}if(action==='refresh')route();if(action==='replay-toggle'){state.playing=!state.playing;renderReplay(state.route.split('/')[1]);if(state.playing){const tick=()=>{if(!state.playing)return;const count=state.data.replay&&state.data.replay.events.length||0;if(state.replayIndex>=count-1){state.playing=false;renderReplay(state.route.split('/')[1]);return;}state.replayIndex++;renderReplay(state.route.split('/')[1]);setTimeout(tick,420)};tick();}}const row=event.target.closest('tr[data-link]');if(row)go(row.dataset.link);const replayRow=event.target.closest('[data-replay-index]');if(replayRow){state.replayIndex=Number(replayRow.dataset.replayIndex);renderReplay(state.route.split('/')[1]);}});
  window.addEventListener('hashchange',route); route();
})();
</script>
</body>
